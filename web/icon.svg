<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Reprend la marque de la barre de titre : l'étoile à quatre branches du
       design system, sur le violet d'accent. Les valeurs sont en dur — un
       fichier d'icône est rasterisé hors de la page, sans jetons CSS. -->
  <defs>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C55EA"/>
      <stop offset="1" stop-color="#5922C9"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#acc)"/>
  <g transform="translate(64 64) scale(3.6) translate(-12 -12)">
    <path d="M12 1.6 16.2 7.8 22.4 12 16.2 16.2 12 22.4 7.8 16.2 1.6 12 7.8 7.8Z" fill="#FCFAFF"/>
  </g>
</svg>
